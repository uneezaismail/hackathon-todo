[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recurring-task-service"
version = "1.0.0"
description = "Microservice for handling recurring task logic via Dapr"
requires-python = ">=3.13"
authors = [
    {name = "GIAIC Team", email = "team@giaic.ai"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]
