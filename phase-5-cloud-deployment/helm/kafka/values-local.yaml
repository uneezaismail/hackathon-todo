---
# Kafka Topic Configuration (applied after Kafka cluster is running)
# These topics are required by the Phase V application

apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-config
  namespace: kafka
data:
  create-topics.sh: |
    #!/bin/bash
    # Script to create required Kafka topics

    KAFKA_BROKERS=${KAFKA_BROKERS:-localhost:9092}

    # Required topics for Phase V
    declare -a TOPICS=(
      "task-events:12:1"              # 12 partitions, 1 replica
      "reminders:12:1"                # Reminder scheduling events
      "task-updates:12:1"             # Real-time task updates
      "dlq-task-events:12:1"          # Dead letter queue
      "dlq-reminders:12:1"            # DLQ for reminders
      "dlq-task-updates:12:1"         # DLQ for updates
    )

    echo "Creating Kafka topics..."

    for topic_spec in "${TOPICS[@]}"; do
      IFS=':' read -r topic partitions replicas <<< "$topic_spec"

      echo "Creating topic: $topic (partitions=$partitions, replicas=$replicas)"

      # Use Redpanda console or rpk if available
      if command -v rpk &> /dev/null; then
        rpk topic create "$topic" \
          --brokers="$KAFKA_BROKERS" \
          --partitions="$partitions" \
          --replication-factor="$replicas" \
          --config retention.ms=604800000  # 7 days
      else
        # Fallback: try kafka-topics script
        kafka-topics --create \
          --bootstrap-server "$KAFKA_BROKERS" \
          --topic "$topic" \
          --partitions "$partitions" \
          --replication-factor "$replicas" \
          --config retention.ms=604800000 \
          --if-not-exists || true
      fi
    done

    echo "Topics created successfully!"

    # List created topics
    if command -v rpk &> /dev/null; then
      rpk topic list --brokers="$KAFKA_BROKERS"
    else
      kafka-topics --list --bootstrap-server "$KAFKA_BROKERS"
    fi

---
# Service to expose Kafka locally
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: kafka
spec:
  type: NodePort
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      nodePort: 31092  # Fixed NodePort for local access
  selector:
    app.kubernetes.io/name: redpanda

---
# Ingress configuration for local development (optional)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-admin
  namespace: kafka
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: kafka-admin.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-admin
                port:
                  number: 9644

---
# Kafka monitoring (Prometheus scrape config)
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-prometheus-config
  namespace: kafka
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'kafka'
        static_configs:
          - targets: ['localhost:9644']
        metrics_path: '/metrics'
