# T088: Local Kafka Deployment Values using Redpanda
#
# This Helm values file configures Kafka for local development using Redpanda,
# a Kafka-compatible event streaming platform optimized for local development.
#
# Redpanda advantages for local dev:
# - Single-node deployment
# - Minimal resource requirements
# - In-memory mode available
# - Direct Kafka wire protocol compatibility
# - Built-in admin API
#
# Usage: helm install kafka redpanda/redpanda -f values-local.yaml --namespace kafka --create-namespace

# Redpanda Helm Chart Configuration
nameOverride: ""
fullnameOverride: ""

# Enable Redpanda StatefulSet
enabled: true

# Cluster Configuration
clusterDomain: cluster.local

# Redpanda Container Configuration
image:
  repository: docker.redpanda.com/redpanda
  tag: "v23.3.1"  # Latest stable
  pullPolicy: IfNotPresent

# Resources for local development (minimal)
resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 2Gi

# Storage Configuration (local development)
storage:
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: standard
    labels: {}
    annotations: {}

# Replicas (1 for local development)
replicas: 1

# Network Configuration
external:
  enabled: true
  type: NodePort
  domain: localhost
  addresses:
    - localhost:31092

# Listeners Configuration
listeners:
  kafka:
    enabled: true
    port: 9092
    tls:
      enabled: false
  admin:
    enabled: true
    port: 9644
    tls:
      enabled: false
  http:
    enabled: true
    port: 8082

# Security
auth:
  enabled: false  # SASL disabled for local dev

# Logging
logging:
  logLevel: info  # Use 'debug' for troubleshooting

# Metrics
monitoring:
  enabled: true
  prometheus:
    enabled: true

# JVM Configuration
jvm:
  heapMinBytes: 256M
  heapMaxBytes: 512M

# SchemaRegistry (optional, useful for local dev)
schemaRegistry:
  enabled: false  # Disabled by default

# Console UI (optional, useful for testing)
console:
  enabled: false  # Disabled by default

# Rack awareness (disabled for single node)
rackAwareness:
  enabled: false

