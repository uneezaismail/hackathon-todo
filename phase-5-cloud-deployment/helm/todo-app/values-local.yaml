# Configuration
config:
  # Environment variables for all services
  env:
    - name: ENVIRONMENT
      value: "local"
    - name: LOG_LEVEL
      value: "DEBUG"
    - name: DAPR_HTTP_PORT
      value: "3500"
    - name: KAFKA_BROKERS
      value: "kafka:9092"
    - name: REDIS_HOST
      value: "redis"
    - name: REDIS_PORT
      value: "6379"

# Storage
storage:
  # Use default storage class
  storageClass: ""
  size: 1Gi

# Dapr Configuration
dapr:
  enabled: true
  namespace: default
  mtls:
    enabled: false  # Disabled for local dev
  logging:
    level: debug  # Debug logging
  metrics:
    enabled: true
    port: 9090

# Network policies
networkPolicy:
  enabled: false  # Disabled for local dev

# Ingress (disabled for local NodePort access)
ingress:
  enabled: false

# No TLS for local development
tls:
  enabled: false

# Pod Security
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

# Resource limits for entire namespace
namespaceQuotas:
  enabled: false

# Autoscaling (disabled for local dev)
autoscaling:
  enabled: false

# Node affinity (none for local dev)
affinity: {}

# Tolerations (none for local dev)
tolerations: []

# Topology spread (disabled for local)
topologySpreadConstraints: []

# Image pull secrets (not needed locally)
imagePullSecrets: []

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC
rbac:
  create: true

# Monitoring (disabled by default)
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false

# Logging (disabled by default)
logging:
  enabled: false
  driver: json-file

# Local development-specific settings
local:
  # Enable hotreload for backend
  hotReload: true
  # Use local docker images
  useLocalImages: true
  # Log verbosity
  verboseLogging: true
  # Keep pods for debugging
  keepFailedPods: false
