# WebSocket Service
websocketService:
  name: websocket-service
  replicas: 1
  port: 8005

  image:
    repository: websocket-service
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8005

  resources:
