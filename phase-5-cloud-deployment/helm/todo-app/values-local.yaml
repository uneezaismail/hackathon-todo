# T090: Local Helm Values for Minikube Development
#
# Optimized for local development with:
# - Single-node Minikube cluster
# - Reduced resource requests/limits
# - NodePort service exposure
# - No TLS/ingress (direct access)
# - Debug logging enabled
# - Disabled mTLS for faster iteration
#
# Usage: helm install todo-app ./helm/todo-app -f values-local.yaml

global:
  environment: local
  imagePullPolicy: IfNotPresent
  # Docker registry (local - no prefix needed for minikube)
  imageRegistry: ""

# Namespace configuration
namespace: default

# Backend Service Configuration
backend:
  name: backend
  replicas: 1  # Single replica for local dev
  port: 8000

  image:
    repository: todo-backend
    tag: latest
    pullPolicy: IfNotPresent

  # NodePort for direct local access
  service:
    type: NodePort
    port: 8000
    nodePort: 30301

  # Minimal resources for local development
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Dapr Sidecar Configuration
  dapr:
    enabled: true
    app_id: backend
    app_port: 8000
    config: dapr-config-local
    log_level: debug  # Debug logging for local dev
    enable_mtls: false  # Disabled for local dev

  # Health checks with longer initial delays for local dev
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8000
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 5
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 5
    failureThreshold: 5
    timeoutSeconds: 3

# Frontend Service Configuration
frontend:
  name: frontend
  replicas: 1
  port: 3000

  image:
    repository: todo-frontend
    tag: latest
    pullPolicy: IfNotPresent

  # NodePort for direct local access
  service:
    type: NodePort
    port: 3000
    nodePort: 30300

  # Minimal resources for local development
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # Health checks
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 5
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 5
    failureThreshold: 5
    timeoutSeconds: 3

# Recurring Task Service
recurringService:
  name: recurring-service
  replicas: 1
  port: 8001

  image:
    repository: recurring-service
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8001

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  dapr:
    enabled: true
    app_id: recurring-service
    app_port: 8001
    config: dapr-config-local
    log_level: debug
    enable_mtls: false

  livenessProbe:
    httpGet:
      path: /health/live
      port: 8001
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8001
    initialDelaySeconds: 30
    periodSeconds: 5
    failureThreshold: 5

# Alert Service
