apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-app.fullname" . }}-audit-service
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-service
spec:
  replicas: {{ .Values.replicaCount.auditService | default 1 }}
  selector:
    matchLabels:
      {{- include "todo-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: audit-service
  template:
    metadata:
      labels:
        {{- include "todo-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: audit-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "audit-service"
        dapr.io/app-port: "8005"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"
        dapr.io/log-as-json: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: audit-service
        image: "{{ .Values.image.auditService.repository }}:{{ .Values.image.auditService.tag }}"
        imagePullPolicy: {{ .Values.image.auditService.pullPolicy }}
        ports:
        - name: http
          containerPort: 8005
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: {{ .Values.healthProbes.auditService.liveness.initialDelaySeconds | default 30 }}
          periodSeconds: {{ .Values.healthProbes.auditService.liveness.periodSeconds | default 15 }}
          timeoutSeconds: {{ .Values.healthProbes.auditService.liveness.timeoutSeconds | default 5 }}
          failureThreshold: {{ .Values.healthProbes.auditService.liveness.failureThreshold | default 3 }}
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: {{ .Values.healthProbes.auditService.readiness.initialDelaySeconds | default 10 }}
          periodSeconds: {{ .Values.healthProbes.auditService.readiness.periodSeconds | default 10 }}
          timeoutSeconds: {{ .Values.healthProbes.auditService.readiness.timeoutSeconds | default 5 }}
          failureThreshold: {{ .Values.healthProbes.auditService.readiness.failureThreshold | default 3 }}
        resources:
          limits:
            cpu: {{ .Values.resources.auditService.limits.cpu | default "500m" }}
            memory: {{ .Values.resources.auditService.limits.memory | default "512Mi" }}
          requests:
            cpu: {{ .Values.resources.auditService.requests.cpu | default "100m" }}
            memory: {{ .Values.resources.auditService.requests.memory | default "256Mi" }}
        envFrom:
        - configMapRef:
            name: {{ include "todo-app.fullname" . }}-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "todo-app.fullname" . }}-secrets
              key: DATABASE_URL
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "todo-app.fullname" . }}-secrets
              key: BETTER_AUTH_SECRET
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: PUBSUB_NAME
          value: "kafka-pubsub"
        - name: STATE_STORE_NAME
          value: "statestore"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
