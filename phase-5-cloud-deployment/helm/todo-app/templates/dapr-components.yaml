# Dapr Components Configuration (T073)
# Defines all 5 Dapr building blocks:
# 1. Pub/Sub (Kafka)
# 2. State Store (Redis)
# 3. Secrets (Kubernetes)
# 4. Jobs API (built-in)
# 5. Service Invocation (built-in)

{{- if .Values.dapr.enabled }}
---
# Pub/Sub Component: Kafka
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: {{ .Release.Namespace }}
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: {{ .Values.config.kafkaBrokers | quote }}
    - name: consumerGroup
      value: "todo-consumer-group"
    - name: maxRetries
      value: "3"
    - name: maxRetryBackoff
      value: "30s"
    - name: topics
      value: "task-events,reminders,task-updates,dlq-task-events,dlq-reminders,dlq-task-updates"
    - name: partitionKey
      value: "user_id"  # Partition by user for ordering

---
# State Store Component: Redis (for idempotency keys)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: {{ .Release.Namespace }}
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: {{ .Values.config.redisHost | quote }}
    - name: redisPort
      value: {{ .Values.config.redisPort | quote }}
    - name: maxRetries
      value: "3"
    - name: maxRetryBackoff
      value: "5s"
    - name: actorStateStore
      value: "true"

---
# Secrets Component: Kubernetes Secrets
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: {{ .Release.Namespace }}
spec:
  type: secretstores.kubernetes
  version: v1

---
# Jobs Component: Scheduler (built-in via Dapr runtime)
# No component needed - accessed via HTTP API
# Endpoint: POST /v1.0-alpha1/jobs/{jobName}

---
# Dapr Configuration
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: {{ .Release.Namespace }}
spec:
  tracing:
    samplingRate: {{ .Values.dapr.tracing.samplingRate | quote }}
    zipkin:
      endpointAddress: {{ .Values.dapr.tracing.zipkinEndpoint | quote }}
  mtls:
    enabled: {{ .Values.dapr.mtls.enabled }}
    allowedClockSkew: 15s
  logging:
    level: {{ .Values.dapr.logging.level | quote }}
    apiLoggingLevel: {{ .Values.dapr.logging.apiLoggingLevel | quote }}
  accessControl:
    enabled: {{ .Values.dapr.accessControl.enabled }}
    defaultAction: {{ .Values.dapr.accessControl.defaultAction | quote }}

{{- end }}
