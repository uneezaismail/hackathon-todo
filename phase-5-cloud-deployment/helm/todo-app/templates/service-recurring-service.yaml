apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app.fullname" . }}-recurring-service
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: recurring-service
spec:
  type: {{ .Values.service.recurringService.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.service.recurringService.port | default 8001 }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "todo-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: recurring-service
