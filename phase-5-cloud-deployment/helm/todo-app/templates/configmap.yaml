apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-app.fullname" . }}-config
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: configuration
data:
  # Better Auth configuration
  BETTER_AUTH_URL: {{ .Values.config.BETTER_AUTH_URL | quote }}

  # Service URLs (internal cluster communication)
  FRONTEND_URL: {{ .Values.config.FRONTEND_URL | quote }}
  BACKEND_URL: {{ .Values.config.BACKEND_URL | quote }}

  # Public URLs (browser-accessible)
  NEXT_PUBLIC_API_URL: {{ .Values.config.NEXT_PUBLIC_API_URL | quote }}
  NEXT_PUBLIC_CHATKIT_URL: {{ .Values.config.NEXT_PUBLIC_CHATKIT_URL | quote }}

  # LLM Provider configuration
  LLM_PROVIDER: {{ .Values.config.LLM_PROVIDER | quote }}
  OPENAI_DEFAULT_MODEL: {{ .Values.config.OPENAI_DEFAULT_MODEL | quote }}
  GEMINI_DEFAULT_MODEL: {{ .Values.config.GEMINI_DEFAULT_MODEL | quote }}
  GROQ_DEFAULT_MODEL: {{ .Values.config.GROQ_DEFAULT_MODEL | quote }}
  OPENROUTER_DEFAULT_MODEL: {{ .Values.config.OPENROUTER_DEFAULT_MODEL | quote }}

  # Logging
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}

  # Phase V: Dapr Configuration
  DAPR_HTTP_PORT: {{ .Values.config.DAPR_HTTP_PORT | quote }}
  DAPR_GRPC_PORT: {{ .Values.config.DAPR_GRPC_PORT | quote }}
  PUBSUB_NAME: {{ .Values.config.PUBSUB_NAME | quote }}
  STATE_STORE_NAME: {{ .Values.config.STATE_STORE_NAME | quote }}
  SECRETS_STORE_NAME: {{ .Values.config.SECRETS_STORE_NAME | quote }}

  # Phase V: Kafka Configuration
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}

  # Phase V: Redis Configuration
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}

  # Phase V: SMTP Configuration (for notification service)
  SMTP_HOST: {{ .Values.config.SMTP_HOST | quote }}
  SMTP_PORT: {{ .Values.config.SMTP_PORT | quote }}
