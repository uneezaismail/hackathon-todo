name: CD - Deploy to Staging

on:
  push:
    branches: [ develop ]

env:
  REGISTRY: todoappreg.azurecr.io
  ENVIRONMENT: staging
  CLUSTER_NAME: todo-aks-staging
  RESOURCE_GROUP: todo-rg-staging
  NAMESPACE: default

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CLUSTER_NAME }} \
            --file kubeconfig.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Update image tags in values file
        run: |
          cat > /tmp/values-override.yaml <<EOF
          backend:
            image:
              tag: ${{ github.sha }}
          frontend:
            image:
              tag: ${{ github.sha }}
          auditService:
            image:
              tag: ${{ github.sha }}
          websocketService:
            image:
              tag: ${{ github.sha }}
          EOF

      - name: Deploy with Helm
        run: |
          helm repo update
          helm upgrade --install todo-app \
            ./phase-5-cloud-deployment/helm/todo-app \
            -f ./phase-5-cloud-deployment/helm/todo-app/values-aks.yaml \
            -f /tmp/values-override.yaml \
            -n ${{ env.NAMESPACE }} \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Run smoke tests
        run: |
          kubectl run smoke-tests \
            --image=${{ env.REGISTRY }}/smoke-tests:latest \
            --env="FRONTEND_URL=http://frontend" \
            --env="BACKEND_URL=http://backend:8000" \
            -n ${{ env.NAMESPACE }} \
            --attach \
            --wait

      - name: Create deployment annotation
        run: |
          kubectl annotate deployment backend \
            -n ${{ env.NAMESPACE }} \
            deployment.kubernetes.io/revision="${{ github.sha }}" \
            --overwrite=true

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Successfully deployed to staging"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to staging failed"
          exit 1
