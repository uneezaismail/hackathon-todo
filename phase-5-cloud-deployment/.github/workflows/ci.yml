name: CI - Tests and Builds

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  REGISTRY: todoappreg.azurecr.io
  DOCKER_BUILDKIT: 1

jobs:
  # Backend Tests (T076)
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./phase-5-cloud-deployment/backend

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run linting
        run: |
          pip install flake8
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./phase-5-cloud-deployment/backend/coverage.xml
          flags: backend
          name: backend-coverage

  # Frontend Tests (T076)
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./phase-5-cloud-deployment/frontend

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./phase-5-cloud-deployment/frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # Terraform Validation (T065)
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./phase-5-cloud-deployment/terraform/aks

    steps:
      - uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  # Helm Lint (T066)
  lint-helm:
    name: Lint Helm Charts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Lint Helm charts
        run: |
          helm lint ./phase-5-cloud-deployment/helm/todo-app

  # Build Docker Images (T076)
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [ test-backend, test-frontend, validate-terraform, lint-helm ]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./phase-5-cloud-deployment/backend
          push: true
          tags: ${{ env.REGISTRY }}/todo-backend:${{ github.sha }}, ${{ env.REGISTRY }}/todo-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./phase-5-cloud-deployment/frontend
          push: true
          tags: ${{ env.REGISTRY }}/todo-frontend:${{ github.sha }}, ${{ env.REGISTRY }}/todo-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push audit-service image
        uses: docker/build-push-action@v4
        with:
          context: ./phase-5-cloud-deployment/services/audit-service
          push: true
          tags: ${{ env.REGISTRY }}/audit-service:${{ github.sha }}, ${{ env.REGISTRY }}/audit-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push websocket-service image
        uses: docker/build-push-action@v4
        with:
          context: ./phase-5-cloud-deployment/services/websocket-service
          push: true
          tags: ${{ env.REGISTRY }}/websocket-service:${{ github.sha }}, ${{ env.REGISTRY }}/websocket-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security Scan (T103)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './phase-5-cloud-deployment'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
