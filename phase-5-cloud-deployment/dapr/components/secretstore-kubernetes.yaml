# Dapr Secret Store Component - Kubernetes Secrets
# Phase V Event-Driven Architecture
#
# This component enables secure access to Kubernetes secrets
# without mounting them as volumes or environment variables.
#
# Usage in Python:
#   # Get secret
#   GET http://localhost:3500/v1.0/secrets/kubernetes-secrets/database-credentials
#   Response: {"DATABASE_URL": "postgresql://...", "password": "..."}
#
#   # Get specific key from secret
#   GET http://localhost:3500/v1.0/secrets/kubernetes-secrets/database-credentials?key=password

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: default
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []

# Required Kubernetes Secrets for Phase V:
#
# 1. database-credentials
#    kubectl create secret generic database-credentials \
#      --from-literal=DATABASE_URL='postgresql://...' \
#      --from-literal=password='...'
#
# 2. kafka-credentials (if using Confluent Cloud)
#    kubectl create secret generic kafka-credentials \
#      --from-literal=username='...' \
#      --from-literal=password='...'
#
# 3. redis-credentials
#    kubectl create secret generic redis-credentials \
#      --from-literal=password='...'
#
# 4. better-auth-secret
#    kubectl create secret generic better-auth-secret \
#      --from-literal=BETTER_AUTH_SECRET='...'
#
# 5. llm-api-keys
#    kubectl create secret generic llm-api-keys \
#      --from-literal=OPENAI_API_KEY='sk-...' \
#      --from-literal=GEMINI_API_KEY='...'

---
# Secret scoping configuration (optional)
# Restricts which services can access which secrets
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-secret-scopes
  namespace: default
spec:
  secrets:
    scopes:
      # Backend can access all secrets
      - storeName: kubernetes-secrets
        defaultAccess: deny
        allowedSecrets:
          - database-credentials
          - better-auth-secret
          - llm-api-keys
        deniedSecrets: []
      # Microservices have limited access
      - storeName: kubernetes-secrets
        defaultAccess: deny
        allowedSecrets:
          - database-credentials
        deniedSecrets:
          - llm-api-keys
